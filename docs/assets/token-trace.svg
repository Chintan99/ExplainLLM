<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img">
  <title>Token relevance trace</title>
  <style>
    #focus-token { transform-box: fill-box; transform-origin: center; animation: focus-token 6s ease-in-out infinite; }
    #focus-score { animation: reveal-score 6s ease-in-out infinite; }
    #focus-bar { transform-box: fill-box; transform-origin: left center; animation: grow-score 6s ease-in-out infinite; }
    .relevance-link { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw-link 6s ease-in-out infinite; }
    .relevance-link.secondary { animation-delay: .15s; }
    #next-token { transform-box: fill-box; transform-origin: center; animation: reveal-token 6s ease-in-out infinite; }
    #top-contributor { animation: reveal-card 6s ease-in-out infinite; }
    #analysis-node { animation: inspect 6s ease-in-out infinite; }
    @keyframes focus-token {
      0%, 10%, 100% { transform: scale(1); }
      18%, 30% { transform: scale(1.08); }
      24% { transform: scale(1.03); }
    }
    @keyframes reveal-score {
      0%, 22% { opacity: .18; }
      30%, 88% { opacity: 1; }
      100% { opacity: .18; }
    }
    @keyframes grow-score {
      0%, 20% { transform: scaleX(.04); opacity: .35; }
      34%, 88% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(.04); opacity: .35; }
    }
    @keyframes draw-link {
      0%, 31% { stroke-dashoffset: 260; opacity: 0; }
      51%, 88% { stroke-dashoffset: 0; opacity: .85; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes reveal-token {
      0%, 47% { opacity: 0; transform: translateY(10px) scale(.88); }
      60%, 88% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }
    @keyframes reveal-card {
      0%, 58% { opacity: .25; }
      70%, 90% { opacity: 1; }
      100% { opacity: .25; }
    }
    @keyframes inspect {
      0%, 100% { opacity: .55; }
      25%, 75% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #focus-token, #focus-score, #focus-bar, .relevance-link, #next-token, #top-contributor, #analysis-node { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f4ee"/></linearGradient>
    <linearGradient id="hot" x1="0" x2="1"><stop stop-color="#ffe6d9"/><stop offset="1" stop-color="#ef895e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#33473b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#277456"/></marker>
  </defs>
  <circle cx="370" cy="285" r="258" fill="#dff4e7" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="70" y="74" width="580" height="458" rx="24" fill="url(#panel)" stroke="#d6dcd3"/>
    <path d="M70 131h580" stroke="#e2e6df"/>
    <circle cx="101" cy="103" r="5" fill="#cbd2ca"/><circle cx="119" cy="103" r="5" fill="#cbd2ca"/><circle cx="137" cy="103" r="5" fill="#cbd2ca"/>
    <rect x="170" y="92" width="298" height="22" rx="6" fill="#edf0eb"/>
    <text x="319" y="107" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#8c948d">explainllm / relevance trace</text>
  </g>

  <text x="112" y="174" font-family="ui-sans-serif,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#277456">CURRENT CONTEXT</text>
  <g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">
    <g><rect x="111" y="196" width="68" height="41" rx="9" fill="#f7f8f4" stroke="#d8ded6"/><text x="145" y="220" fill="#565e57">The</text></g>
    <g><rect x="187" y="196" width="76" height="41" rx="9" fill="#f7f8f4" stroke="#d8ded6"/><text x="225" y="220" fill="#565e57">color</text></g>
    <g><rect x="271" y="196" width="54" height="41" rx="9" fill="#f7f8f4" stroke="#d8ded6"/><text x="298" y="220" fill="#565e57">of</text></g>
    <g id="focus-token"><rect x="333" y="196" width="91" height="41" rx="9" fill="#fff5ef" stroke="#e99d7d"/><text x="378.5" y="220" fill="#98472d" font-weight="700">grass</text></g>
    <g><rect x="432" y="196" width="48" height="41" rx="9" fill="#f7f8f4" stroke="#d8ded6"/><text x="456" y="220" fill="#565e57">is</text></g>
  </g>

  <path d="M145 248v48M225 248v48M298 248v48M378 248v48M456 248v48" stroke="#cad2ca" stroke-dasharray="3 4"/>
  <g font-family="ui-monospace,monospace" font-size="10" text-anchor="middle" fill="#637069">
    <text x="145" y="316">.04</text><text x="225" y="316">.19</text><text x="298" y="316">.07</text><text id="focus-score" x="378" y="316" fill="#a84b2f" font-weight="700">.48</text><text x="456" y="316">.22</text>
  </g>
  <g>
    <rect x="122" y="330" width="46" height="5" rx="2.5" fill="#d9ddd7"/><rect x="202" y="330" width="46" height="5" rx="2.5" fill="#d9ddd7"/><rect x="275" y="330" width="46" height="5" rx="2.5" fill="#d9ddd7"/><rect x="355" y="330" width="46" height="5" rx="2.5" fill="#f0d0c2"/><rect x="433" y="330" width="46" height="5" rx="2.5" fill="#d9ddd7"/>
    <rect x="122" y="330" width="5" height="5" rx="2.5" fill="#79ad91"/><rect x="202" y="330" width="18" height="5" rx="2.5" fill="#79ad91"/><rect x="275" y="330" width="8" height="5" rx="2.5" fill="#79ad91"/><rect id="focus-bar" x="355" y="330" width="46" height="5" rx="2.5" fill="url(#hot)"/><rect x="433" y="330" width="21" height="5" rx="2.5" fill="#79ad91"/>
  </g>

  <path class="relevance-link" d="M378 348C378 406 470 394 500 434" fill="none" stroke="#277456" stroke-width="3" opacity=".85" marker-end="url(#arrow)"/>
  <path class="relevance-link secondary" d="M225 348C239 410 418 388 482 435" fill="none" stroke="#277456" stroke-width="1.5" opacity=".35"/>
  <path class="relevance-link secondary" d="M456 348C456 388 485 397 500 426" fill="none" stroke="#277456" stroke-width="2" opacity=".47"/>

  <g id="next-token" filter="url(#shadow)">
    <rect x="477" y="422" width="122" height="71" rx="14" fill="#183e2e"/>
    <text x="538" y="447" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#a9efc7">NEXT TOKEN</text>
    <text x="538" y="476" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="white">green</text>
  </g>
  <g id="top-contributor" font-family="ui-sans-serif,sans-serif">
    <text x="111" y="391" font-size="10" font-weight="700" letter-spacing="1.4" fill="#277456">TOP CONTRIBUTOR</text>
    <text x="111" y="426" font-size="26" font-weight="650" fill="#181c19">grass</text>
    <text x="111" y="451" font-size="12" fill="#667068">48% of this step’s relevance</text>
    <rect x="111" y="470" width="215" height="9" rx="4.5" fill="#e2e7e0"/><rect x="111" y="470" width="103" height="9" rx="4.5" fill="#e47847"/>
  </g>
  <g id="analysis-node" transform="translate(526 165)">
    <circle r="32" fill="#e6f4ea" stroke="#c9dfcf"/>
    <path d="M-13 0h26M0-13v26" stroke="#277456" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#a9efc7" stroke="#277456"/>
  </g>
</svg>
